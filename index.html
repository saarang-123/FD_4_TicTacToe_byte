<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Play Tic Tac Toe online with a simple, responsive and fun two-player game.">
    <meta name="theme-color" content="#111827">
    <title>Tic Tac Toe | Two Player Game</title>
   <link rel="icon" type="image/svg+xml" href="tictoc.svg">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="gameContainer">
        <h1>Tic Toc Toe</h1>
        <div id="cellContainer">
            <div classIndex="0" class="cell"></div>
            <div classIndex="1" class="cell"></div>
            <div classIndex="2" class="cell"></div>
            <div classIndex="3" class="cell"></div>
            <div classIndex="4" class="cell"></div>
            <div classIndex="5" class="cell"></div>
            <div classIndex="6" class="cell"></div>
            <div classIndex="7" class="cell"></div>
            <div classIndex="8" class="cell"></div>
        </div>
        <h2 id="statusText"></h2>
        <button id="restartBtn">Restart</button>
    </div>


    <script src="script.js"></script>
</body>

</html>
